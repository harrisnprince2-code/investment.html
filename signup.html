<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Investment Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #06140b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #0b1f12;
      border: 1px solid #1f8f4d;
      border-radius: 22px;
      padding: 35px 28px;
      box-shadow: 0 20px 60px rgba(0, 255, 100, 0.12);
    }

    .logo {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #19a94f;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 24px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #a9c5b2;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #d8eadc;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 18px;
      border-radius: 11px;
      border: 1px solid #285d3c;
      background: #06140b;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #21c65f;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: #19a94f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #21c65f;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      color: #ff7777;
      font-size: 14px;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #a9c5b2;
    }

    .login a {
      color: #35d96e;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">IP</div>

    <h1>Create Account</h1>

    <p class="subtitle">
      Create your investment portal account
    </p>

    <form id="signupForm">

      <label>Full Name</label>

      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label>Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <label>Confirm Password</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="6"
        required
      >

      <button type="submit">
        CREATE ACCOUNT
      </button>

      <div class="message" id="message"></div>

    </form>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    // Firebase configuration

    const firebaseConfig = {
      apiKey: "AIzaSyB9A9cHTxi6tOqDRbQ5iW6DBk32z4f-7Vk",
      authDomain: "investment-d2eff.firebaseapp.com",
      projectId: "investment-d2eff",
      storageBucket: "investment-d2eff.firebasestorage.app",
      messagingSenderId: "857545616627",
      appId: "1:857545616627:web:5df53c1e2dd4551e3d1b86",
      measurementId: "G-LXL1ZQ01SK"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    document
      .getElementById("signupForm")
      .addEventListener("submit", async (e) => {

        e.preventDefault();

        const name =
          document.getElementById("name").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        const message =
          document.getElementById("message");


        if (password !== confirmPassword) {

          message.textContent =
            "Passwords do not match.";

          return;
        }


        try {

          message.style.color = "#35d96e";

          message.textContent =
            "Creating your account...";


          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          await updateProfile(user, {
            displayName: name
          });


          await setDoc(
            doc(db, "users", user.uid),
            {
              name: name,
              email: email,
              investedAmount: 0,
              currentProfit: 0,
              expectedProfit: 0,
              investmentDate: "",
              withdrawalDate: "",
              status: "ACTIVE",
              createdAt: new Date().toISOString()
            }
          );


          window.location.href =
            "investment.html";


        } catch (error) {

          console.error(error);

          message.style.color = "#ff7777";

          if (error.code === "auth/email-already-in-use") {

            message.textContent =
              "This email is already registered.";

          } else if (error.code === "auth/weak-password") {

            message.textContent =
              "Password must be at least 6 characters.";

          } else {

            message.textContent =
              error.message;
          }

        }

      });

  </script>

</body>
</html>
