<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Investment Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #06140b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #0b1f12;
      border: 1px solid #1f8f4d;
      border-radius: 22px;
      padding: 40px 28px;
      box-shadow: 0 20px 60px rgba(0,255,100,.12);
    }

    .logo {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #19a94f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #a9c5b2;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d8eadc;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 1px solid #285d3c;
      background: #06140b;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #21c65f;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #19a94f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #21c65f;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      color: #ff7777;
      font-size: 14px;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
      color: #a9c5b2;
    }

    .signup a {
      color: #35d96e;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">IP</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to your investment account
    </p>

    <form id="loginForm">

      <label>Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        LOGIN
      </button>

      <div class="message" id="message"></div>

    </form>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Create Account</a>
    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyB9A9cHTxi6tOqDRbQ5iW6DBk32z4f-7Vk",
      authDomain: "investment-d2eff.firebaseapp.com",
      projectId: "investment-d2eff",
      storageBucket: "investment-d2eff.firebasestorage.app",
      messagingSenderId: "857545616627",
      appId: "1:857545616627:web:5df53c1e2dd4551e3d1b86",
      measurementId: "G-LXL1ZQ01SK"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    document
      .getElementById("loginForm")
      .addEventListener("submit", async (e) => {

        e.preventDefault();


        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");


        try {

          message.style.color = "#35d96e";

          message.textContent =
            "Signing in...";


          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          window.location.href =
            "investment.html";


        } catch (error) {

          console.error(error);

          message.style.color = "#ff7777";

          if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found"
          ) {

            message.textContent =
              "Invalid email or password.";

          } else {

            message.textContent =
              error.message;
          }

        }

      });

  </script>

</body>
</html>
